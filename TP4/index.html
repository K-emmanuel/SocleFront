<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExploMonde</title>
    <link rel="stylesheet" href="css/token.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body>
    <a class="skip-link" href="#contenu-principal">Aller au contenu principal</a>

    <header class="site-header">
        <div>
            <p class="eyebrow">Carnet du monde</p>
            <h1>ExploMonde</h1>
            <p class="intro">Explorez les pays, une destination à la fois.</p>
        </div>
        <nav aria-label="Navigation principale">
            <a href="#recherche">Recherche</a>
            <a href="#resultats">Résultats</a>
        </nav>
    </header>

    <main id="contenu-principal">
        <section class="search-panel" id="recherche">
            <h2>Filtrer les pays</h2>
            <form>
                <label for="region">Région</label>
                <select id="region">
                    <option value="Toutes">Toutes les régions</option>
                </select>
            </form>
        </section>

        <section id="resultats">
            <h2>Résultats</h2>
            <p id="etat-resultats" role="status" aria-live="polite"></p>

            <div class="country-grid" id="country-grid"></div>

            <div id="detail-pays" aria-live="polite">
                <h3>Détail</h3>
                <p>Cliquez sur une carte pour voir le détail du pays.</p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; ExploMonde</p>
    </footer>
    <script type="module" src="js/main.js"></script>
</body>
</html>
